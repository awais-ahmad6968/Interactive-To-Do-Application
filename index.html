<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="./script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="min-h-screen text-base flex justify-center items-center bg-[#F5F6FA] font-[Poppins]">

    <div class="bg-white rounded-[12px] p-8 shadow-2xl w-[540px]">

        <h1 class="text-4xl text-[#24243A] font-bold text-center mb-8 ">To-Do List</h1>

        <div class="mb-8 p-4 gap-4 border-2 border-[#e5e7ef] flex items-center justify-between rounded-lg">
            <div class="grow">
                <h2 class="text-2xl text-[#34344A] font-bold">Keep it Up!</h2>
                <div class="mt-4 h-2 rounded-lg bg-[#E5E7EF]">
                    <div id ="progress" class="rounded-lg h-full w-[0%] bg-amber-400"></div>
                </div>
            </div>
            <div class="size-16 bg-[#6C5CE7] border-2 border-[#6C5CE7] text-white flex items-center justify-center rounded-full">
                <p  id="numbers" class="text-xl">0/0</p>
            </div>
        </div>
        <form class="flex gap-[10px] mb-8 items-start"> <!--items-start prevents button to stretch height -->
            <div class="grow">
                <input type="text" id="task-inp" class="outline-none border-2 border-[#E7E9EF] p-3 rounded-[16px] w-full" placeholder="Add task here..">
                <small id="err-msg" class="text-[#ff3860] text-[14px] pl-2"></small>
            </div> 
            <!--By adding pl-2 the width of div section increases and button stretched due to less width. So we added shrink=0 on it-->
            <button type="submit" class=" shrink-0 py-3 px-[20px] text-[18px] cursor-pointer bg-[#6C5CE7] transition duration-300 ease hover:bg-[#5847D6] text-white rounded-[8px]">+ Add</button>
        </form>
            <h2 id = "emptyMsg" class="text-xl text-[#77798A] text-center font-semibold hidden">No Tasks Yet</h2>
            
        <ul id="tasks">  
                
        </ul>
        
    </div>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
          
</body>
</html>
